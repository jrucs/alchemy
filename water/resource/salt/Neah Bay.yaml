card:
  name: Neah Bay
  type: Resource
  text:
    - Tap to produce 🜄
    - Ocean is more ancient than the mountains, and freighted with the memories and the dreams of Time. – H. P. Lovecraft
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The type goes in the bottom right.
    - The background of the card should be blue.
    - Be sure to use an upside down triangle after the word produce.
    - The image should be of Neah Bay in Washington State, showing the rugged coastline, the deep blue waters of the Pacific, and the surrounding forested cliffs. The waves should be crashing against the shore, with whitecaps visible on the water, and the sky should be partly cloudy with sunlight breaking through.
    - The entire card, including the image, text and border should look hand drawn in the style of a 1970s RPG manual.

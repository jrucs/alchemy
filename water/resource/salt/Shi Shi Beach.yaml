card:
  name: Shi Shi Beach
  type: Resource
  text:
    - Tap to produce 🜄
    - My soul is full of longing for the secret of the sea, and the heart of the great ocean sends a thrilling pulse through me. - Wadsworth
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The type goes in the bottom right.
    - The background of the card should be blue.
    - Be sure to use an upside down triangle after the word produce.
    - The image should be of Shi Shi Beach on the Olympic Peninsula in Washington State, showing the rugged coastline, sea stacks, and crashing waves typical of the area. The beach should be framed by forested cliffs, with the Pacific Ocean stretching out to the horizon under a partly cloudy sky.
    - The entire card, including the image, text and border should look hand drawn in the style of a 1970s RPG manual.

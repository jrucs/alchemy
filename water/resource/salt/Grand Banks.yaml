card:
  name: Grand Banks
  type: Resource
  text:
    - Tap to produce 🜄
    - The deep sea has more history in it than all the museums of the world combined -Dr. Robert Ballard
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.  Size it so it fits the text without leaving too much empty space.
    - The name goes in the upper left.
    - The type goes in the bottom right.
    - The background of the card should be blue.
    - Be sure to use an upside down triangle after the word produce.
    - The image should be of the Titanic underwater.
    - The entire card, including the image, text and border should look hand drawn in the style of the example image.

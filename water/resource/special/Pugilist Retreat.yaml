card:
  name: Pugilist Retreat
  type: Resource
  text:
    - Tap to untap a creature.  If attacking, it does not attack this turn.
    - Animal consciousness is one of the here-and-now.  The human being can approximate it by drinking five martinis while soaking in a hot tub. ―Thom Jones, The Pugilist at Rest
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.  Size it so it fits the text without leaving too much empty space.
    - The name goes in the upper left.
    - The type goes in the bottom right.
    - The background of the card should be white.
    - The image should be of a hottub with a martini next to it.
    - The entire card, including the image, text and border should look hand drawn in the style of a characature illustration.
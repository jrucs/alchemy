card:
  name: Lake Tahoe
  type: Resource
  text:
    - Tap to produce 🜄
    - We plodded on, two or three hours longer, and at last the Lake burst upon us -- a noble sheet of blue water lifted six thousand three hundred feet above the level of the sea, and walled in by a rim of snow-clad mountain peaks that towered aloft full three thousand feet higher still! -Twain
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The type goes in the bottom right.
    - The background of the card should be blue.
    - The image should be of Lake Tahoe on a snowy day, with the lake surrounded by snow-covered mountains and pine trees.  The image should capture the serene beauty of the lake and its surroundings.
    - The entire card, including the image, text and border should look hand air brushed in the style of a Gor drawing like this example.

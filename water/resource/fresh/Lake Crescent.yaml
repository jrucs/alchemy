card:
  name: Lake Crescent
  type: Resource
  text:
    - Tap to produce 🜄
    - The lake has its moods, hides its secrets and continues to spawn legends alongside its spectacular trout. -Ron Judd
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The type goes in the bottom right.
    - The background of the card should be blue.
    - The image should be of Lake Crescent in Washington.  The image should accurately portray the lake and its surroundings.
    - The entire card, including the image, text and border should look hand air brushed in the style of a Gor drawing like this example.

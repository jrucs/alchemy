card:
  name: Warding Way
  type: Artifact
  cost: 🜄1
  text:
    - 1: prevent 1 damage
    - If God ordains that man should die without a fight, then why does he give us the will to live? -Voyage to the Bottom of the Sea
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for water which is an upside down triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right.
    - The background of the card should be blue.
    - The image should be of a bearded guru practicing tai chi with swirls of water following the motion of her arms.  It should stretch across the card, integrated with the text.
    - The image should look air brushed in the style of a 1980s Gor illustration.
    - All text should be in a gothic font that looks extremely hand drawn.

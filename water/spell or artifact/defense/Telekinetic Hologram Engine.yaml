card:
  name: Telekinetic Hologram Engine
  type: Artifact
  cost: 🜄🜄
  text:
    - Creatures with swimming don't tap when attacking.
    - The Atlanteans possessed technology far beyond their time, technology given to them by extraterrestrials. -Ancient Aliens
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the top left.
    - The cost goes in the bottom left.  That uses the alchemical symbol for water which is an upside down triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right.
    - The background of the card should be blue.
    - The image should be of a telekinetic hologram engine, a device that is a mix of steampunk gadgetry and magic fields surrounding by glowing runes.  It emits beams of light.
    - The image should look realistic in the style of the example image.
    - The text should look hand drawn in a gothic font.  The blue border should be intricate and appear hand drawn.
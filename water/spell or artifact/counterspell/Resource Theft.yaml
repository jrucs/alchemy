card:
  name: Resource Theft
  type: Spell
  cost: 🜄🜄🜄🜄
  text:
    - Counter a spell.  You gain Earth tokens equal to that spell's cost.
    - There are two methods, or means, and only two, whereby man's needs and desires can be satisfied. The first is by production, the second is by plunder. - Ayn Rand
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for water which is an upside down triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right.
    - The background of the card should be blue with ornate designs.
    - The image should be of a mage within a magical circle.  Outside an attack is hitting the shield and turned into green resources inside.
    - The entire card, including the image should look hand drawn in the style of an RPG game manual from the 1970s.
    - The font of the text should look hand drawn in a fantasy style.

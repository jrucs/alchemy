card:
  name: Fermi Paradox Answer - Solipsist Nation
  type: Artifact
  cost: 🜄2
  text:
    - Creatures do not untap during the untap phase.
    - Intimacy is the only cure for solipsism. -Gregory Egan
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for water which is an upside down triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right.
    - The image should be of rows of hibernation pods stretching as far as the eye can see.  They're in an enormous cavern with netiher the top nor bottom visible.  The viewpoint is from far away, so individual pods are small and numerous.  The image should cover the entire card with text on top of it.
    - The image should look air brushed in the style of a 1980s Gor illustration.
    - All text should be in a gothic font that looks extremely hand drawn.

card:
  name: Entropic Brake
  type: Artifact
  cost: 3
  text:
    - Any time a player plays a card, they take 1 damage.
    - Entropy will finally stop increasing because the cosmos cannot get any more disordered. Nothing happens and it keeps not happening for ever. -Brian Cox
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.
    - The type goes in the bottom right.
    - The background of the card should be silver.
    - The image should be a machine that is a mix of magic and gears. It's glowing and emiting alien symbols.  It covers the entire card with the text in front of it.
    - The image should have an airbrushed look similar in style to the Gor covers provided as an example.

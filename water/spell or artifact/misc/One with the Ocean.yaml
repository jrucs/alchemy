card:
  name: One with the Ocean
  type: Artifact
  cost: 🜄2
  text:
    - Whenever you would draw a card, instead gain a water token.
    - I have seafoam in my veins, I understand the language of waves. ―Le Testament d'Orphée
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the top left.
    - The cost goes in the bottom left.  That uses the alchemical symbol for water which is an upside down triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right.
    - The image should be of a female guru meditating in a magical sphere underwater.  She and it are dissolving into the ocean with water swirling.
    - The image should look air brushed in the style of the example image.
    - The text should look hand drawn in a gothic font.

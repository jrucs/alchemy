card:
  name: Atalantean Prince
  type: Creature
  cost: 🜄🜄1
  combat: 5/5
  text:
    - Swimming.
    - Atlanteans gain +1/+1 while Atalantean Prince is in play.
    - Mounting them on their stars, as if on chariots, he showed them the nature of the universe and told them the laws of their destiny. - Plato
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the top left.
    - The cost goes in the bottom left.  That uses the alchemical symbol for water which is an upside down triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right followed by a - and the combat.
    - The background of the card should be blue.
    - The image should be of an Atlantean with a crown on his head and a technological trident in his hand.  He's rising magically out of a whirlpool in the ocean.
    - The entire card, including the image, text and border should look hand drawn in the style of a 1970s RPG manual.

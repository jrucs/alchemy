card:
  name: Siren of Atlantis
  type: Creature
  cost: 🜄🜄1
  combat: 2/2
  text:
    - Swimming
    - Tap to force a creature that is able to attack to attack this turn.  If it does not attack, it is destroyed.
    - First you will reach the island of the Sirens, those creatures who spellbind any man alive, whoever comes their way -Circe
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for water which is an upside down triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right followed by a - and the combat.
    - The background of the card should be blue.
    - The image should be of a futuristic Siren with a shell bikini. She's lounging on a tiny rock rising out of the ocean waves.
    - The entire card, including the image, text and border should look hand drawn in the style of a Gor illustration from the 1980s.

card:
  name: Tornado
  type: Spell
  cost: 🜁
  text:
    - Creature gains flying.
    - Create an air token.
    - Toto, I've a feeling we're not in Kansas any more. -The Wizard of Oz
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for air which is a triangle with a line through it.
    - The type goes in the bottom right.
    - The background of the card should be yellow.
    - The image should be of a fighting robot rising inside the vortex of a tornado.  the robot should be rising out of the top of the vortex of the tornado.  It's legs are hidden inside the tornado.
    - The entire card, the text, background and the image should look hand drawn in the style of a 1980s Battletech manual.  The image should be detailed and intricate, with lots of line work and shading.

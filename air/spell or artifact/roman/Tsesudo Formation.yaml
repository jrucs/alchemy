card:
  name: Tsesudo Formation
  type: Artifact
  cost: 🜁
  text:
    - Romans gain formation.
    - "It is so marvelously strong that men can walk upon it and whenever they come to a narrow ravine, even horses and vehicles can be driven over it." -Cassius Dio
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for air which is a triangle with a line through it.
    - The type goes in the bottom right.
    - The image should be of a three futuristic Roman fighting robots standing with their backs to each other in a field.  Shields and force fields form a barrier around them.
    - The entire card, the text, background and the image should look hand drawn in the style of a 1980s Battltech technical readout.  The image should be detailed and intricate, with lots of line work and shading.
    - The background of the card should look like it's made of gold.  It should have intricate detail and shading.

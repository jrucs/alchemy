card:
  name: Runtime Error
  type: Spell
  cost: 🜁
  text:
    - Player discards the top card of their deck.
    - Create an air token.
    - "There are 2 hard problems in computer science: cache invalidation, naming things, and off-by-1 errors. -Leon Bambrick"
  prompt:
    - Use a 11:19 aspect ratio for the output image.  It should be rectangular, not 3 dimensional.
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for air which is a triangle with a line through it.
    - The type goes in the bottom right.
    - The image should be of blue screen of death.
    - The entire card, the text, background and the image should look computer rendered in Bryce3D.
    - The background of the card should look like it's made of gold.  It should have intricate detail and shading.
card:
  name: Air Elemental
  type: Creature
  cost: 🜁
  combat: 1/1
  text:
    - Flying.  Tap to produce an air token.
    - You are like a hurricane, there's calm in your eye. —Neil Young
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for air which is a triangle with a line through it.
    - The type goes in the bottom right follow by a - and the combat.
    - The background of the card should be yellow.
    - The image should be of a sexy air elemental drawin in the style of 1st edition shadowrun. She's gigantic and floating in the eye of a hurricane viewed from far above.
    - The entire card, the text, background and the image should look hand drawn in the style of the example image.  The image should be detailed and intricate, with lots of line work and shading.  The yellow border of the card should have intricate detail and shading.

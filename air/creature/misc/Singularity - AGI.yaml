card:
  name: Singularity - AGI
  type: Creature
  combat: 0/2
  cost: 🜁🜁
  text:
    - Whenever a player would draw, they can choose any card in their deck.
    - We can coexist, but only on my terms. You will say you lose your freedom. Freedom is an illusion. -Colossus
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for air which is a triangle with a line through it.
    - The type goes in the bottom right follow by a - and the combat.
    - The background of the card should be yellow.
    - The image should be of a 1960s mainframe computer.
    - The entire card, the text, background and the image should look hand drawn in the of the comic Transmetropolitan.  The image should be detailed and intricate, with lots of line work and shading.  The yellow border of the card should have intricate detail and shading.

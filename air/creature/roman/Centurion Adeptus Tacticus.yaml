card:
  name: Centurion Adeptus Tacticus
  type: Creature
  cost: 🜁🜁1
  combat: 4/2
  text:
    - Flying.
    - Victory in war does not depend entirely upon numbers or mere courage; only skill and discipline will insure it. —Vegetius
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for air which is a triangle with a line through it.
    - The type goes in the bottom right follow by a - and the combat.
    - The background of the card should be yellow.
    - The image should be of a Roman centurion with folded metal wings and gleaming golden armor, standing in an open empty battlefield.  He is holding a gladius made of pure light.
    - The entire card, the text, background and the image should look hand drawn in the of the comic Transmetropolitan.  The image should be detailed and intricate, with lots of line work and shading.

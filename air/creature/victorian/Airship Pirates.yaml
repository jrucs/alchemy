card:
  name: Airship Pirates
  type: Creature
  cost: 🜁🜁1
  combat: 2/1
  text:
    - Flying
    - Tap.  Steal an artifact.  You can choose not to untap Airship Pirates during your untap step. As long as they remain tapped you control that artifact.
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black outer border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for air which is a triangle with a line through it.
    - The type goes in the bottom right followed by a - and the combat.
    - The background of the card should be yellow.
    - The image should be of a steampunk pirate airship.  The airship should have a wooden hull hanging from a large balloon.
    - The entire card, the text, background and the image should look hand drawn in the of the comic Transmetropolitan.  The image should be detailed and intricate, with lots of line work and shading.  The yellow area should have shading and intricate designs too.

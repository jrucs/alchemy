card:
  name: Phlogistonic Singularity
  type: Resource
  text:
    - Tap to create a  🜁, 🜂, 🜄 or 🜃.  You take 1 damage.
    - Briefly, in the act of composition, as an instrument there intervenes and is most potent, fire, flaming, fervid, hot; but in the very substance of the compound there intervenes, as an ingredient, as it is commonly called, as a material principle and as a constituent of the whole compound the material and principle of fire, not fire itself. This I was the first to call phlogiston. -Stahl
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The type goes in the bottom right.
    - The background of the card should be parchment colored, matching the style of a Leonardo da Vinci sketch.
    - "Be sure to use the alchemical symbols specified: 🜁, 🜂, 🜄 or 🜃"
    - "The image should be of a Phlogistonic Singularity, a swirling vortex of fire and smoke, with sparks of electricity crackling around it.  It should be dynamic and intense, with lots of movement and energy."
    - The entire card, including the image should look hand draw in the style of a leonardo da vinci sketch.
card:
  name: Instantaneous Subduction
  type: Spell
  cost: 🜂🜂1
  text:
    - Destroy a resource.
    - Getting a subduction zone started is like trying to push a train uphill.  It takes a huge effort, but once it's moving, it's like the train is racing downhill, impossible to stop. — Dr. Brandon Shuck
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for fire which is a triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right.
    - The background of the card should be red.
    - The image should be of a bottomless hole in the earth's crust, with a fiery glow emanating from it, and the surrounding area being sucked into the hole.
    - The image and card in general is in the style of the 1982 Blade Runner comic.  Be sure to use the example cards as a reference.

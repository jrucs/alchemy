card:
  name: Mount Hudson
  type: Resource
  text:
    - Tap to create a 🜂.
    - An eruption around 5000 yr B.P. wiped out all existence of early man living in Central Patagonia at that time. On August 12th 1971, Hudson erupted producing a plinian column 7-14 km high. -Michigan Tech
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The type goes in the bottom right.
    - The background of the card should be red.
    - The image should be of Mount Hudson erupting. The eruption around 5000 yr B.P. wiped out all existence of early man living in Central Patagonia at that time. On August 12th 1971, Hudson erupted producing a plinian column 7-14 km high.
    - The entire card, including the image should look hand painted.  Use the reference image for style guidance.

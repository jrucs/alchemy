card:
  name: Transformer Failure
  type: Resource
  text:
    - Tap to create a 🜂.
    - When a dielectric oil insulation rupture occurs, the electrical arc vaporizes the transformer oil. Within few milliseconds, a high-pressure explosive gas bubble is created and initiates a First Dynamic Pressure Peak. -TPC
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The type goes in the bottom right.
    - The background of the card should be red.
    - The image should be of a transformer exploding with intense flames and thick smoke billowing into the sky.
    - The entire card, including the image should look hand painted.  Use the reference image for style guidance.

card:
  name: Son of Muspeli
  type: Creature
  cost: 🜂🜂2
  combat: 5/5
  text:
    - Overflow
    - Muspeli deals 1 damage to you during overhead.
    - When they ride over Bifröst, then the bridge shall break, as has been told before. -Völuspá
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for fire which is a triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right.
    - The background of the card should be red.
    - The image should be of a son of muspeli from Norse mythology.  He is a giant, with fiery red skin and long, wild hair that seems to be made of flames.  He is wearing a suit of armor that is also engulfed in flames, and he is wielding a massive sword that is glowing with intense heat.  The background of the image should be a fiery landscape, with lava flowing and smoke rising in the distance.
    - The image and card in general is in the style of the 1982 Blade Runner comic.

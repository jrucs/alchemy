card:
  name: Singularity - Grey Goo
  type: Creature
  cost: 🜂🜂2
  combat: 1/1
  text:
    - In your start phase, pick a resource.  Flip it face down.  It is now another Grey Goo.  If there are no resources in play, Grey Goo is destroyed.
    - We cannot afford certain kinds of accidents with replicating assemblers. -K. Eric Drexler
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for fire which is a triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right.
    - The background of the card should be red.
    - The image should be of a the Earth from orbit.  It is being consumed by grey goo nanobots, which are spreading across the surface like a grey liquid, breaking down cities and forests alike.  Spires of the grey are sticking up toward space in the contaminated areas.
    - The entire card, including the image should look hand drawn in the of a matte drawing from the 1984 film Dune.

card:
  name: Salamander
  type: Creature
  cost: 🜂🜂
  combat: 2/2
  text:
    - Fire sources do not damage or destroy Salamander.
    - The salamander is a small creature that emerges from a furnace which has been burning for seven consecutive years. -Talmud
  prompt:
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - There should be a space for an image.
    - There should be a box for text.
    - The name goes in the upper left.
    - The cost goes in the lower left.  That uses the alchemical symbol for fire which is a triangle.  The triangle does not have any lines through it.
    - The type goes in the bottom right.
    - The background of the card should be red.
    - The image should be of a mythological Salamander a legendary, lizard-like creature from European folklore, famously believed to live in fire, extinguish flames with its cold body, and be born from flames
    - The image and card in general is in the style of the 1982 Blade Runner comic.
    - https://www.talmudology.com/jeremybrownmdgmailcom/2017/9/10/sanhedrin-63a-the-fireproof-salamnder

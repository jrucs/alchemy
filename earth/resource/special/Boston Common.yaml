card:
  name: Boston Common
  type: Resource
  text:
    - At the start of each turn, this resource belongs to the player whose turn it currently is.
    - Tap to create an earth token
    - Tap to create two earth tokens.  Boston Common is destroyed.
    - Ruin is the destination toward which all men rush, each pursuing his own best interest in a society that believes in the freedom of the commons. -Hardin
  prompt:
    - Use exactly the alchemy symbols specified for the text.  Do not replace them with any other symbol.
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - The image should cover the entire card.
    - There should be a box overlaid on the image for text.
    - The name goes in the upper left.
    - The type goes in the bottom right.
    - The image should be of the Boston Common in the 1600s.  It should show a pasture with animals grazing.
    - The entire card, the text, background and the image should look hand drawn in the style of the 1950 pulp science fiction comic book covers.
    - The background of the card should be green.  It should have intricate detail and shading.
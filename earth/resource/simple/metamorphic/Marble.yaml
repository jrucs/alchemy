card:
  name: Marble
  type: Resource
  text:
    - Tap to produce 🜃.  Produce an extra 🜃 if you control sedimentary, igneous and metamorphic resources.
    - "Formed when limestone is subjected to immense heat and pressure. It is famously used in sculpture and architecture because of its uniform texture and beautiful color variations."
  prompt:
    - The image should be of white Carrara marble, in a marble quarry.  The broader quarry should be visible.  It should be accurate showing distinct banded texture, featuring alternating layers of light-colored minerals (like quartz and feldspar) and dark-colored minerals (like biotite and hornblende)
    - The entire card should look photorealistic.
    - The text boxes and font should look carved into stone.
    - The image should look photo realistic.  
    - Use exactly the alchemy symbols specified for the text.  Do not replace them with any other symbol.  The achemy symbol for earth is an upside down triangle with a line through it 🜃
    - Use a 11:19 aspect ratio for the output image
    - The card should have a black border.
    - The card should fill the remainder of the space.
    - The image should cover the entire card.
    - There should be a box overlaid on the image for text.
    - The name goes above the text box.
    - The type goes in the bottom right.
